name: NGO Grants Mini App — real Telegram signed preflight, NO ORDERS, rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-real-session-dryrun.yml'
      - 'worker/mini_app_expected_worker_version.py'

permissions:
  contents: read

concurrency:
  group: ngo-grants-worker-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_BOT_GATEWAY_URL: ${{ secrets.NGO_BOT_GATEWAY_URL }}
      NGO_BOT_SYNC_SECRET: ${{ secrets.NGO_BOT_SYNC_SECRET }}
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      NGO_SIGNED_MINI_APP_DRYRUN_APPROVED: 'YES_READ_ONLY_CANARY_AND_ROLLBACK'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate no-write preflight scripts and real v0.5.3 security health
        run: |
          python -m py_compile worker/patch_mini_app_real_session_dryrun.py worker/mini_app_real_session_dryrun_with_rollback.py
          python -m pip install telethon==1.45.0
          python scripts/mini_app_v05_health_readonly.py
      - name: Stage only ephemeral no-write endpoint, test genuine signed Telegram session, always rollback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP}/signed-main-miniapp-no-writes.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          python worker/read_live_mini_app_v05_diagnosis.py "$scratch/original.mjs"
          python worker/patch_mini_app_real_session_dryrun.py "$scratch/original.mjs" "$scratch/preflight.mjs"
          node --check "$scratch/preflight.mjs"
          python worker/stage_worker_mini_app.py "$scratch/preflight.mjs"
          python worker/mini_app_real_session_dryrun_with_rollback.py
