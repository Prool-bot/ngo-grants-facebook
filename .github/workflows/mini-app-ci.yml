name: NGO Grants AI — Mini App preview CI

on:
  pull_request:
    paths:
      - "mini-app/**"
      - "worker/mini_app_verify_init_data.mjs"
      - "worker/mini_app_order_endpoint.mjs"
      - "worker/mini_app_keyboard_bridge.mjs"
      - "worker/patch_live_worker_mini_app.py"
      - "worker/stage_worker_mini_app.py"
      - "worker/patch_live_worker_mini_app_start_v03.py"
      - "worker/patch_live_worker_mini_app_fop_v04.py"
      - "worker/build_mini_app_fop_v04_candidate.py"
      - "worker/deploy_worker_mini_app_fop_v04.py"
      - "tests/test_mini_app_fop_v04_*.py"
      - ".github/workflows/mini-app-fop-v04.yml"
      - "worker/build_mini_app_start_v03_candidate.py"
      - "worker/deploy_worker_mini_app_start_v03.py"
      - "scripts/mini_app_start_v03_edit_post.py"
      - "tests/test_mini_app_start_v03_*.py"
      - ".github/workflows/mini-app-direct-start-v03.yml"
      - ".github/workflows/mini-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check mini-app/schema.js
          node --check mini-app/app.js
          node --check worker/mini_app_verify_init_data.mjs
          node --check worker/mini_app_order_endpoint.mjs
          node --check worker/mini_app_keyboard_bridge.mjs
          python -m py_compile worker/patch_live_worker_mini_app.py worker/stage_worker_mini_app.py
      - name: Verify schema and isolated preview safety
        run: node --test mini-app/tests/*.test.cjs mini-app/tests/*.test.mjs
      - name: Check synthetic Worker patch and fail-closed anchors
        run: python -m unittest discover -s tests -p 'test_mini_app_worker_patch.py' -v
      - name: Test 6th/7th step navigation and surgical Worker hotfix
        run: |
          python -m unittest discover -s tests -p 'test_mini_app_nav_v02_patch.py' -v
          python -m unittest discover -s tests -p 'test_mini_app_nav_v02_release.py' -v
      - name: Test direct Start and existing post edit before any public rollout
        run: |
          python -m py_compile worker/patch_live_worker_mini_app_start_v03.py worker/build_mini_app_start_v03_candidate.py worker/deploy_worker_mini_app_start_v03.py scripts/mini_app_start_v03_edit_post.py
          python -m unittest discover -s tests -p 'test_mini_app_start_v03_*.py' -v
          python -m unittest discover -s tests -p 'test_mini_app_fop_v04_*.py' -v
          node --check tests/test_mini_app_start_direct_worker.mjs
      - name: Publish preview files as CI artifact, not a public deployment
        uses: actions/upload-artifact@v4
        with:
          name: mini-app-static-preview
          path: mini-app/
          retention-days: 14
