name: NGO Grants — read-only Telegram Mini App member lookup check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-member-lookup-readonly.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test safe script syntax and install Telegram read-only client
        run: |
          python -m py_compile scripts/mini_app_member_lookup_readonly.py
          python -m pip install telethon==1.45.0
      - name: Check real bot getChatMember for existing authorized session
        run: python scripts/mini_app_member_lookup_readonly.py
