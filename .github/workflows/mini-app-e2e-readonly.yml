name: NGO Grants Mini App — live read-only order-flow acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-e2e-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngo-grants-mini-app-e2e-audit
  cancel-in-progress: false

jobs:
  acceptance:
    name: Live Worker + D1 queue read-only + simulated Telegram order + synthetic PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_BOT_GATEWAY_URL: ${{ secrets.NGO_BOT_GATEWAY_URL }}
      NGO_BOT_SYNC_SECRET: ${{ secrets.NGO_BOT_SYNC_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF test dependencies
        run: python -m pip install reportlab==4.4.9 pypdf==5.9.0
      - name: Check types and exercise questionnaire with fake local browser
        run: |
          python -m py_compile scripts/mini_app_v02_e2e_readonly.py
          node --check tests/test_mini_app_actual_worker_order_bridge_e2e.mjs
          node --test mini-app/tests/*.test.cjs mini-app/tests/*.test.mjs
      - name: Run real grant pipeline integration logic with isolated synthetic data
        run: |
          python -m unittest discover -s tests -p 'test_ngo_grants_v59_integration.py' -v
          python -m unittest discover -s tests -p 'test_ngo_grants_v59_delivery.py' -v
          python -m unittest discover -s tests -p 'test_ngo_grants_v59_resume.py' -v
      - name: Read live health, HTML, queued-count and exact deployed Worker; no writes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "${RUNNER_TEMP}/ngo-e2e.XXXXXX")"
          trap 'rm -rf "$private_dir"' EXIT
          python scripts/mini_app_v02_e2e_readonly.py "$private_dir/deployed-worker.mjs"
          node --check "$private_dir/deployed-worker.mjs"
          node tests/test_worker_menu_v58.mjs "$private_dir/deployed-worker.mjs"
          node tests/test_mini_app_actual_worker_order_bridge_e2e.mjs "$private_dir/deployed-worker.mjs"
          echo 'E2E_ACCEPTANCE_PASSED_NO_REAL_ORDER'
      - name: Generate two synthetic PDFs without publishing anything
        run: python scripts/v59_staging_preview.py
      - name: Preserve only synthetic PDF examples (no private Worker source)
        uses: actions/upload-artifact@v4
        with:
          name: mini-app-e2e-synthetic-grant-catalogs
          path: output/v59-staging-preview/*.pdf
          if-no-files-found: error
          retention-days: 7
