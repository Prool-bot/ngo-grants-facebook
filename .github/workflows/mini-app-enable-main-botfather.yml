name: NGO Grants Main Mini App — one-time verified BotFather registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-enable-main-botfather.yml'

permissions:
  contents: write

concurrency:
  group: ngo-grants-botfather-main-app-settings
  cancel-in-progress: false

jobs:
  register_existing:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_BOT_GATEWAY_URL: ${{ secrets.NGO_BOT_GATEWAY_URL }}
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NGO_BOTFATHER_MAIN_APP_RELEASE_APPROVED: 'YES_ENABLE_EXISTING_NGO_GRANTS_MAIN_APP_ONCE'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit test strict one-shot owner lock and BotFather prompt guard
        run: |
          python -m py_compile scripts/mini_app_enable_main_botfather_once.py
          python -m unittest discover -s tests -p 'test_mini_app_enable_main_botfather_once.py' -v
      - name: Confirm live signed API and legacy Telegram menu before enabling Main App
        run: python scripts/mini_app_v05_health_readonly.py
      - name: Install already verified Telegram owner-session MTProto client
        run: python -m pip install telethon==1.45.0
      - name: Enable Main Mini App for only existing NGO Grants bot, once
        run: python scripts/mini_app_enable_main_botfather_once.py
      - name: Verify official bot Main Mini App status, read-only
        run: python scripts/mini_app_main_app_status.py
