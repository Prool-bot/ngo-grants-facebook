name: NGO Grants AI v5.7 Quality CI

on:
  pull_request:
    paths:
      - "ngo_grants_ai.py"
      - "catalog_guard_v57.py"
      - "tests/**"
      - "worker/menu_refinement_v57.js"
      - ".github/workflows/ngo-grants-v57-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python and Worker menu tests (no Telegram publication)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test PDF dependencies
        run: python -m pip install reportlab==4.4.9 pypdf==5.9.0
      - name: Python syntax check
        run: python -m py_compile ngo_grants_ai.py catalog_guard_v57.py
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit last seven published catalogues against v5.7 hard rules
        run: |
          python - <<'PY'
          from collections import Counter
          import ngo_grants_ai as app
          from catalog_guard_v57 import quality_status

          archive = {int(p['id']): p['text'] for p in app.read_archive()}
          for c in app.load_state().get('published', [])[-7:]:
              facets = c.get('facets')
              counts = Counter(quality_status(archive.get(i, ''), facets)
                               for i in c.get('post_ids', []))
              print(c['id'], c['title'][:70], 'old:', len(c.get('post_ids', [])),
                    'direct:', counts['direct'],
                    'conditional:', counts['conditional'],
                    'rejected:', counts['reject'])
          PY
      - name: Check menu JavaScript module syntax
        run: node --input-type=module --check < worker/menu_refinement_v57.js
