name: Telegram Archive & Search

on:
  push:
    branches: [main]
    paths:
      - 'telegram_archive.py'
      - 'tests/test_telegram_archive.py'
      - '.github/workflows/telegram-archive.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Звірити всю доступну історію каналу'
        type: boolean
        default: false
      query:
        description: 'Пошук: слова або фраза в подвійних лапках'
        type: string
        default: ''
      mode:
        description: 'all — усі слова; any — будь-яке слово'
        type: choice
        options: [all, any]
        default: all
      since:
        description: 'Від дати YYYY-MM-DD (за Києвом)'
        type: string
        default: ''
      until:
        description: 'До дати YYYY-MM-DD включно'
        type: string
        default: ''
      url:
        description: 'Пошук дубля за URL першоджерела'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: telegram-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Перевірити логіку архіву і пошуку
        run: python -m unittest discover -s tests -v
      - name: Встановити Telethon
        run: python -m pip install telethon==1.45.0
      - name: Оновити архів загальнодоступного каналу
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          FULL_SYNC: ${{ inputs.full_sync }}
        run: |
          if [ "$FULL_SYNC" = "true" ]; then
            python -u telegram_archive.py sync --full
          else
            python -u telegram_archive.py sync
          fi
      - name: Зберегти архів у репозиторії
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- archive/telegram/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update public NGO Grants Telegram archive'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Виконати пошук
        if: inputs.query != '' || inputs.url != '' || inputs.since != '' || inputs.until != ''
        env:
          SEARCH_QUERY: ${{ inputs.query }}
          SEARCH_MODE: ${{ inputs.mode }}
          SEARCH_SINCE: ${{ inputs.since }}
          SEARCH_UNTIL: ${{ inputs.until }}
          SEARCH_URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          args = ['python', 'telegram_archive.py', 'search', os.environ['SEARCH_QUERY'], '--limit', '30', '--output', 'output/telegram-search.json']
          for flag, name in [('--mode', 'SEARCH_MODE'), ('--since', 'SEARCH_SINCE'), ('--until', 'SEARCH_UNTIL'), ('--url', 'SEARCH_URL')]:
              if os.environ.get(name):
                  args.extend([flag, os.environ[name]])
          subprocess.run(args, check=True)
          PY
      - name: Зберегти результати пошуку
        if: success() && (inputs.query != '' || inputs.url != '' || inputs.since != '' || inputs.until != '')
        uses: actions/upload-artifact@v4
        with:
          name: telegram-search-${{ github.run_id }}
          path: output/telegram-search.json
          retention-days: 14
