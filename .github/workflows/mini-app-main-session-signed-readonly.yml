name: NGO Grants — read-only real signed Main Mini App session readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-main-session-signed-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate local verifier and install read-only Telegram client
        run: |
          python -m py_compile scripts/mini_app_main_session_readonly.py scripts/mini_app_verify_init_data_offline.py
          python -m pip install telethon==1.45.0
      - name: Request real Main Mini App view without submitting an order
        run: python scripts/mini_app_main_session_readonly.py
