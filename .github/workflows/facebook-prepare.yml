name: Facebook daily preparation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facebook-daily-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install telethon==1.45.0 Pillow

      - name: Prepare posts and images
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import asyncio
          import base64
          import io
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          OUTPUT = Path("output")
          OUTPUT.mkdir(exist_ok=True)

          REQUIRED = (
              "TELEGRAM_API_ID",
              "TELEGRAM_API_HASH",
              "TELEGRAM_SESSION",
              "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_API_TOKEN",
          )

          for name in REQUIRED:
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Відсутній секрет: {name}")

          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"].strip()

          if not re.fullmatch(r"[a-fA-F0-9]{32}", ACCOUNT_ID):
              raise SystemExit("Некоректний CLOUDFLARE_ACCOUNT_ID")

          MODEL = "@cf/black-forest-labs/flux-1-schnell"

          def save_json(path, value):
              path.write_text(
                  json.dumps(value, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          def full_text(message):
              text = (message.raw_text or "").strip()
              urls = []

              for entity in message.entities or []:
                  url = getattr(entity, "url", None)
                  if (
                      url
                      and url.startswith(("https://", "http://"))
                      and url not in text
                      and url not in urls
                  ):
                      urls.append(url)

              if urls:
                  text += "\n\nПосилання:\n" + "\n".join(urls)

              return text

          def get_title(text):
              for line in text.splitlines():
                  if line.strip():
                      return line.strip()
              return "Грантові можливості"

          def generate_image(title):
              prompt = (
                  "Create an editorial illustration for this opportunity: "
                  + title[:650]
                  + ". Interpret the topic visually. "
                  "Professional cultural and educational magazine style, "
                  "elegant composition, rich teal and golden colors. "
                  "No text, no letters, no logos, no watermark."
              )

              endpoint = (
                  "https://api.cloudflare.com/client/v4/accounts/"
                  + ACCOUNT_ID
                  + "/ai/run/"
                  + MODEL
              )

              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(
                      {"prompt": prompt, "steps": 4}
                  ).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=180
                  ) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"Cloudflare повернув HTTP {error.code}"
                  ) from None
              except urllib.error.URLError:
                  raise RuntimeError(
                      "Не вдалося підключитися до Cloudflare"
                  ) from None

              if payload.get("success") is False:
                  codes = [
                      str(item.get("code", "unknown"))
                      for item in payload.get("errors", [])
                  ]
                  raise RuntimeError(
                      "Помилка Cloudflare: " + ", ".join(codes)
                  )

              encoded = (payload.get("result") or {}).get("image")
              if not encoded:
                  raise RuntimeError(
                      "Cloudflare не повернув зображення"
                  )

              if encoded.startswith("data:"):
                  encoded = encoded.split(",", 1)[1]

              with Image.open(
                  io.BytesIO(base64.b64decode(encoded))
              ) as source:
                  source.load()
                  return ImageOps.fit(
                      source.convert("RGB"),
                      (1080, 1080),
                  )

          def load_font(size, bold=False):
              filename = (
                  "DejaVuSans-Bold.ttf"
                  if bold
                  else "DejaVuSans.ttf"
              )
              path = (
                  "/usr/share/fonts/truetype/dejavu/"
                  + filename
              )
              return ImageFont.truetype(path, size)

          def wrap_title(draw, text, font, width):
              lines = []
              current = ""

              for word in text.split():
                  candidate = (
                      current + " " + word
                  ).strip()

                  if (
                      current
                      and draw.textlength(
                          candidate, font=font
                      ) > width
                  ):
                      lines.append(current)
                      current = word
                  else:
                      current = candidate

              if current:
                  lines.append(current)

              return lines

          def brand_image(image, title, destination):
              draw = ImageDraw.Draw(image)

              # Залишаємо українські літери, прибираємо
              # емодзі, які цей шрифт може не підтримувати.
              clean_title = re.sub(
                  r"[^\w\s.,:;!?()'’«»/—–+\-]",
                  "",
                  title,
                  flags=re.UNICODE,
              ).strip()

              clean_title = clean_title or "Грантові можливості"

              for size in range(46, 23, -2):
                  font = load_font(size, bold=True)
                  lines = wrap_title(
                      draw, clean_title, font, 960
                  )
                  if len(lines) <= 5:
                      break

              line_height = size + 12
              panel_height = (
                  110 + len(lines) * line_height
              )
              panel_top = 1080 - panel_height

              draw.rectangle(
                  (0, panel_top, 1080, 1080),
                  fill=(13, 48, 53),
              )

              draw.text(
                  (60, panel_top + 25),
                  "NGO Grants",
                  font=load_font(30, bold=True),
                  fill=(244, 197, 92),
              )

              y = panel_top + 80
              for line in lines:
                  draw.text(
                      (60, y),
                      line,
                      font=font,
                      fill="white",
                  )
                  y += line_height

              image.save(destination, quality=95)

          async def select_posts():
              kyiv = ZoneInfo("Europe/Kyiv")
              today = datetime.now(kyiv).date()
              yesterday = today - timedelta(days=1)

              start = datetime.combine(
                  yesterday,
                  datetime.min.time(),
                  tzinfo=kyiv,
              ).astimezone(timezone.utc)

              end = datetime.combine(
                  today,
                  datetime.min.time(),
                  tzinfo=kyiv,
              ).astimezone(timezone.utc)

              client = TelegramClient(
                  StringSession(
                      os.environ["TELEGRAM_SESSION"].strip()
                  ),
                  int(os.environ["TELEGRAM_API_ID"].strip()),
                  os.environ["TELEGRAM_API_HASH"].strip(),
                  receive_updates=False,
              )

              candidates = []

              try:
                  await client.connect()

                  if not await client.is_user_authorized():
                      raise RuntimeError(
                          "Сесія Telegram не авторизована"
                      )

                  channel = await client.get_entity("ngo_grants")

                  async for message in client.iter_messages(
                      channel, offset_date=end
                  ):
                      if message.date < start:
                          break
                      if message.date >= end:
                          continue
                      if not (message.raw_text or "").strip():
                          continue
                      if message.views is None:
                          continue

                      candidates.append(message)

                  candidates.sort(
                      key=lambda item: (item.views, item.id),
                      reverse=True,
                  )

                  posts = []

                  for rank, message in enumerate(
                      candidates[:3], start=1
                  ):
                      text = full_text(message)
                      posts.append({
                          "rank": rank,
                          "telegram_message_id": message.id,
                          "telegram_url": (
                              f"https://t.me/ngo_grants/{message.id}"
                          ),
                          "views": message.views,
                          "title": get_title(text),
                          "text": text,
                          "image_file": f"post-{rank}.jpg",
                      })

                  return yesterday, len(candidates), posts

              finally:
                  await client.disconnect()

          def main():
              day, count, posts = asyncio.run(select_posts())

              manifest = {
                  "selection_date": str(day),
                  "timezone": "Europe/Kyiv",
                  "prepared_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "candidate_count": count,
                  "status": "preparing",
                  "posts": posts,
              }

              save_json(OUTPUT / "manifest.json", manifest)

              print(f"Дата відбору: {day}")
              print(f"Кількість кандидатів: {count}")
              print(f"Відібрано дописів: {len(posts)}")

              for post in posts:
                  rank = post["rank"]

                  (OUTPUT / f"post-{rank}.txt").write_text(
                      post["text"],
                      encoding="utf-8",
                  )

                  print(
                      f"Місце {rank}: "
                      f"{post['views']} переглядів"
                  )
                  print(post["telegram_url"])
                  print("Створення зображення…")

                  image = generate_image(post["title"])
                  brand_image(
                      image,
                      post["title"],
                      OUTPUT / post["image_file"],
                  )

                  print(f"Зображення {rank} готове")

              manifest["status"] = "ready"
              save_json(OUTPUT / "manifest.json", manifest)

              print("Підготовку завершено.")
              print("У Facebook нічого не опубліковано.")

          main()
          PY

      - name: Save prepared materials
        uses: actions/upload-artifact@v4
        with:
          name: facebook-prepared-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
