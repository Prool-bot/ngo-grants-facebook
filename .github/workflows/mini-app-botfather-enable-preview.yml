name: NGO Grants Main Mini App — inspect Enable button without toggling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-botfather-enable-preview.yml'

permissions:
  contents: read

concurrency:
  group: ngo-grants-botfather-main-app-settings
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      NGO_BOTFATHER_ENABLE_PREVIEW_APPROVED: 'YES_INSPECT_ENABLE_ONLY'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate exact existing Mini App enable option, offline
        run: |
          python -m py_compile scripts/mini_app_botfather_enable_preview.py
          python -m unittest discover -s tests -p 'test_mini_app_botfather_enable_preview.py' -v
      - name: Install Telegram MTProto client
        run: python -m pip install telethon==1.45.0
      - name: Inspect BotFather Enable Mini App button only, no settings changes
        run: python scripts/mini_app_botfather_enable_preview.py
