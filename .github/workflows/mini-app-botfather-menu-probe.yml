name: NGO Grants Main Mini App — one-time safe BotFather menu preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-botfather-menu-probe.yml'

permissions:
  contents: read

concurrency:
  group: ngo-grants-botfather-main-app-settings
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      NGO_BOTFATHER_MENU_PROBE_APPROVED: 'YES_MYBOTS_READ_ONLY_MENU'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test strict target bot name
        run: |
          python -m py_compile scripts/mini_app_botfather_menu_probe.py
          python -m unittest discover -s tests -p 'test_mini_app_botfather_menu_probe.py' -v
      - name: Install official MTProto client
        run: python -m pip install telethon==1.45.0
      - name: Ask ONLY official BotFather for owned bot menu, change NO settings
        run: python scripts/mini_app_botfather_menu_probe.py
