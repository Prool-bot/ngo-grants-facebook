name: NGO Grants — support on no-results messages and shown post 4241
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/no-results-support.yml'
      - 'scripts/edit_no_results_support_4241.py'
permissions:
  contents: write
concurrency:
  group: ngo-grants-main-mini-app-channel-pilot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      NGO_NO_RESULTS_SUPPORT_APPROVED: YES_EDIT_SHOWN_POST_4241_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test support formatting and navigation offline
        run: |
          python -m py_compile ngo_grants_ai.py scripts/edit_no_results_support_4241.py
          python -m unittest discover -s tests -p 'test_public_support.py' -v
          python -m unittest discover -s tests -p 'test_ngo_grants_v59_navigation.py' -v
      - name: Install existing Telegram verification client
        run: python -m pip install telethon==1.45.0
      - name: Edit only the exact existing message 4241 and verify
        run: python scripts/edit_no_results_support_4241.py
