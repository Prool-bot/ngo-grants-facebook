name: NGO Grants Mini App — owner BotFather menu availability check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-botfather-nav.yml'

permissions:
  contents: read

concurrency:
  group: ngo-grants-botfather-main-app-settings
  cancel-in-progress: false

jobs:
  check_menu:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      NGO_BOTFATHER_NAV_PREVIEW_APPROVED: 'YES_NAVIGATE_NO_SETTINGS'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test exact known BotFather buttons and fail-closed behavior
        run: |
          python -m py_compile scripts/mini_app_botfather_nav_readonly.py
          python -m unittest discover -s tests -p 'test_mini_app_botfather_nav_readonly.py' -v
      - name: Install read-only Telegram session client
        run: python -m pip install telethon==1.45.0
      - name: Check only existing NGO Grants bot Configure Mini App menu; change NO settings
        run: python scripts/mini_app_botfather_nav_readonly.py
