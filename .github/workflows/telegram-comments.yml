name: Telegram Public Comments Archive

on:
  push:
    branches: [main]
    paths:
      - 'telegram_comments.py'
      - 'tests/test_telegram_comments.py'
      - '.github/workflows/telegram-comments.yml'
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Повторно прочитати всі публікації каналу'
        type: boolean
        default: false
      days:
        description: 'Днів для оновлення (1–3650)'
        type: number
        default: 45

permissions:
  contents: write

# Same group as posts archive prevents concurrent writes to main.
concurrency:
  group: telegram-archive
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Перевірити обробку коментарів
        run: python -m unittest discover -s tests -v
      - name: Встановити Telethon
        run: python -m pip install telethon==1.45.0
      - name: Прочитати коментарі (лише публічна група)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          FULL_SYNC: ${{ inputs.full_sync }}
          DAYS: ${{ inputs.days }}
        run: |
          if [ "$FULL_SYNC" = "true" ]; then
            python -u telegram_comments.py sync --full
          else
            python -u telegram_comments.py sync --days "${DAYS:-45}"
          fi
      - name: Зберегти архів коментарів
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- archive/telegram/comments/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update public NGO Grants comments archive'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
