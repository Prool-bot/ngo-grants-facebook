name: NGO Grants — production Mini App v0.5.1 D1 order readback repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-v051-d1-status-fix.yml'

permissions:
  contents: write

concurrency:
  group: ngo-grants-worker-production-deploy
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_BOT_GATEWAY_URL: ${{ secrets.NGO_BOT_GATEWAY_URL }}
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NGO_V051_D1_STATUS_RELEASE_APPROVED: 'YES_RELEASE_MINI_APP_V051_D1_STATUS_FIX'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify one-literal status fix offline and existing read-only health
        run: |
          python -m py_compile worker/patch_mini_app_v051_status_fix.py worker/mini_app_expected_worker_version.py worker/release_mini_app_v051_status_fix.py
          python -m unittest discover -s tests -p 'test_mini_app_v051_status_fix.py' -v
          python -m unittest discover -s tests -p 'test_mini_app_v05_health_readonly.py' -v
          node --check tests/probe_mini_app_v05_actual_sqlite_offline.mjs
          python scripts/mini_app_v05_health_readonly.py
      - name: Fetch current deployed Worker to temp, patch exact status, real SQLite e2e
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP}/mini-app-v051-fix.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          python worker/read_live_mini_app_v05_diagnosis.py "$scratch/old.mjs"
          python worker/patch_mini_app_v051_status_fix.py "$scratch/old.mjs" "$scratch/fixed.mjs"
          node --check "$scratch/fixed.mjs"
          node --disable-warning=ExperimentalWarning tests/probe_mini_app_v05_actual_sqlite_offline.mjs "$scratch/fixed.mjs"
          echo "STRICT_SQLITE_SIMULATED_ORDER_AND_READBACK_PASSED=True"
          python worker/stage_worker_mini_app.py "$scratch/fixed.mjs"
          python worker/release_mini_app_v051_status_fix.py
