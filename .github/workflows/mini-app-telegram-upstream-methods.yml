name: NGO Grants Mini App — probe Telegram API upstream methods (no orders)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-telegram-upstream-methods.yml'

permissions:
  contents: read

concurrency:
  group: ngo-grants-worker-production-deploy
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_BOT_GATEWAY_URL: ${{ secrets.NGO_BOT_GATEWAY_URL }}
      NGO_BOT_SYNC_SECRET: ${{ secrets.NGO_BOT_SYNC_SECRET }}
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      NGO_TELEGRAM_UPSTREAM_METHOD_PROBE_APPROVED: 'YES_TRIPLE_READONLY_MEMBER_METHODS'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check no-write probe and existing v0.5.2 security health
        run: |
          python -m py_compile worker/patch_mini_app_telegram_upstream_probe_v053.py worker/mini_app_telegram_upstream_probe_with_rollback.py
          python -m pip install telethon==1.45.0
          python scripts/mini_app_v05_health_readonly.py
      - name: Test live Telegram upstream GET/POST only and automatically revert temporary Worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP}/miniapp-telegram-methods.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          python worker/read_live_mini_app_v05_diagnosis.py "$scratch/original.mjs"
          python worker/patch_mini_app_telegram_upstream_probe_v053.py "$scratch/original.mjs" "$scratch/probe.mjs"
          node --check "$scratch/probe.mjs"
          python worker/stage_worker_mini_app.py "$scratch/probe.mjs"
          python worker/mini_app_telegram_upstream_probe_with_rollback.py
