name: NGO Grants — one-time repair of result 3815 Main Mini App CTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-repair-result-3815.yml'

permissions:
  contents: write

concurrency:
  group: ngo-grants-result-3815-direct-app
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NGO_GRANTS_RESULT_LINK_REPAIR_APPROVED: 'YES_REPAIR_EXISTING_RESULT_3815_ONCE'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Offline check no results CTA and strict one-shot edit contract
        run: |
          python -m py_compile scripts/mini_app_repair_result_3815.py
          python -m unittest discover -s tests -p 'test_mini_app_repair_result_3815.py' -v
          python -m unittest discover -s tests -p 'test_catalog_main_mini_app_links.py' -v
      - name: Install read-only Telegram session for historic message verification
        run: python -m pip install telethon==1.45.0
      - name: Verify and edit only result 3815 in place (no new message)
        run: python scripts/mini_app_repair_result_3815.py
