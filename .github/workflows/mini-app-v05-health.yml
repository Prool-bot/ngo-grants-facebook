name: NGO Grants Mini App v0.5 — secure live health and BotFather readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-v05-health.yml'
      - 'scripts/mini_app_v05_health_readonly.py'
      - 'tests/test_mini_app_v05_health_readonly.py'
  schedule:
    - cron: '47 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngo-grants-mini-app-v05-health
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_BOT_GATEWAY_URL: ${{ secrets.NGO_BOT_GATEWAY_URL }}
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests for no-write health and session ownership probes
        run: |
          python -m py_compile scripts/mini_app_v05_health_readonly.py scripts/mini_app_main_owner_readonly.py
          python -m unittest discover -s tests -p 'test_mini_app_v05_health_readonly.py' -v
          python -m unittest discover -s tests -p 'test_mini_app_main_owner_readonly.py' -v
      - name: Live signed-HMAC rejection, old menu and deployment check (no real orders)
        run: python scripts/mini_app_v05_health_readonly.py
      - name: Install Telegram read-only session client
        run: python -m pip install telethon==1.45.0
      - name: Check existing Telegram session capability to manage bot via BotFather
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/mini_app_main_owner_readonly.py
