name: NGO Grants Mini App — read-only deployed Worker shape audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-worker-shape-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Cloudflare source structure — no Worker code in logs
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check read-only audit
        run: python -m py_compile scripts/mini_app_worker_shape_audit.py
      - name: Inspect deployed Worker in memory without downloading to disk
        run: python scripts/mini_app_worker_shape_audit.py
