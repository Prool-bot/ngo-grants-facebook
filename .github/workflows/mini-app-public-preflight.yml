name: NGO Grants Mini App — existing bot & channel public launch preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-public-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only tests, no external bot writes
        run: |
          python -m py_compile scripts/mini_app_public_preflight.py
          python -m unittest discover -s tests -p 'test_mini_app_public_preflight.py' -v
      - name: Get official current bot identity, channel permissions and commands
        run: python scripts/mini_app_public_preflight.py
