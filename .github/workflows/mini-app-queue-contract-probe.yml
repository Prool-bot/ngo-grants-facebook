name: NGO Grants Mini App — live queue contract read-only study

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-queue-contract-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngo-grants-worker-production-deploy
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check queue contract probe and BotFather Main Mini App flag
        run: |
          python -m py_compile worker/read_live_mini_app_v04_contract.py scripts/mini_app_main_app_status.py
          node --check tests/probe_mini_app_real_worker_create_request.mjs
      - name: Check official existing bot Main Mini App registration (read-only)
        run: python scripts/mini_app_main_app_status.py
      - name: Run actual deployed createRequest on fake DB and fake Telegram only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP}/miniapp-queue-contract.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          python worker/read_live_mini_app_v04_contract.py "$scratch/worker.mjs"
          node --check "$scratch/worker.mjs"
          node tests/probe_mini_app_real_worker_create_request.mjs "$scratch/worker.mjs"
          echo 'CONTRACT_PROBE_COMPLETE_ZERO_REAL_D1_WRITES_ZERO_REAL_TELEGRAM_MESSAGES'
