name: Repair Facebook links
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facebook-publication
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 Pillow telethon==1.45.0
      - name: Repair and verify October 8 captions
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import asyncio, os, time
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from facebook_full_test import full_text, graph
          pairs = [
              (3044, "1246967778508832_122118409917463303"),
              (3055, "1246967778508832_122118409995463303"),
              (3036, "1246967778508832_122118410061463303"),
          ]
          async def repair():
              client = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"].strip()), int(os.environ["TELEGRAM_API_ID"]), os.environ["TELEGRAM_API_HASH"], receive_updates=False)
              try:
                  await client.connect()
                  if not await client.is_user_authorized():
                      raise RuntimeError("Telegram session is not authorized")
                  channel = await client.get_entity("ngo_grants")
                  for message_id, post_id in pairs:
                      source = f"https://t.me/ngo_grants/{message_id}"
                      current = graph("GET", post_id, {"fields": "id,message"})
                      if source not in (current.get("message") or ""):
                          raise RuntimeError("Facebook post does not match Telegram source")
                      message = await client.get_messages(channel, ids=message_id)
                      if not message or not message.raw_text:
                          raise RuntimeError("Telegram source not found")
                      caption = full_text(message) + "\n\n" + source
                      if current["message"] != caption:
                          graph("POST", post_id, {"message": caption})
                      for attempt in range(10):
                          verified = graph("GET", post_id, {"fields": "id,message"})
                          if (verified.get("message") or "").split() == caption.split():
                              break
                          time.sleep(2)
                      else:
                          print("EXPECTED:", repr(caption))
                          print("RECEIVED:", repr(verified.get("message")))
                          raise RuntimeError("Facebook caption verification failed")
                      print("VERIFIED:", post_id, "full link targets next to labels")
                  print("SUCCESS: All three captions verified. No new posts or videos created.")
              finally:
                  await client.disconnect()
          asyncio.run(repair())
          PY

