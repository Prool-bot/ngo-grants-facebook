name: NGO Grants Mini App — verify Main App in channel with no order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-main-channel-no-order.yml'

permissions:
  contents: read

concurrency:
  group: ngo-grants-main-webview-safe-probe
  cancel-in-progress: false

jobs:
  verify_channel:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      NGO_MAIN_WEBVIEW_SAFE_PROBE_APPROVED: 'YES_CHANNEL_WEBVIEW_NO_ORDER'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assert no-order test uses only empty facets and exact app origin
        run: |
          python -m py_compile scripts/mini_app_main_channel_webview_no_order.py
          python -m unittest discover -s tests -p 'test_mini_app_main_channel_webview_no_order.py' -v
      - name: Install existing Telegram owner session MTProto client
        run: python -m pip install telethon==1.45.0
      - name: Verify channel-scoped Main WebView and signed initData without ordering catalog
        run: python scripts/mini_app_main_channel_webview_no_order.py
