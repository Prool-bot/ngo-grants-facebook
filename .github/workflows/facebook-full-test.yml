name: Facebook daily publication
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Facebook (unchecked = preview only)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: facebook-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 Pillow telethon==1.45.0
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Prepare and publish three posts and one Reel
        env:
          PUBLISH_TO_FACEBOOK: ${{ inputs.publish }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -u facebook_full_test.py
      - name: Save materials and publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-full-test-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
