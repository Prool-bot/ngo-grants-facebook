name: NGO Grants — safe temporary Worker D1 aggregate diagnosis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-d1-aggregate-probe-v052.yml'

permissions:
  contents: read

concurrency:
  group: ngo-grants-worker-production-deploy
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_BOT_GATEWAY_URL: ${{ secrets.NGO_BOT_GATEWAY_URL }}
      NGO_BOT_SYNC_SECRET: ${{ secrets.NGO_BOT_SYNC_SECRET }}
      NGO_GRANTS_AI_BOT_TOKEN: ${{ secrets.NGO_GRANTS_AI_BOT_TOKEN }}
      NGO_D1_AGGREGATE_PROBE_APPROVED: 'YES_READONLY_001_WITH_ROLLBACK'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check temporary patch syntax and current read-only Worker health
        run: |
          python -m py_compile worker/patch_mini_app_d1_aggregate_probe_v052.py worker/mini_app_d1_aggregate_probe_with_rollback_v052.py
          python scripts/mini_app_v05_health_readonly.py
      - name: Temporary canary D1 count inspection, always revert 100% to approved baseline
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP}/v052-d1-aggregate.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          python worker/read_live_mini_app_v05_diagnosis.py "$scratch/original.mjs"
          python worker/patch_mini_app_d1_aggregate_probe_v052.py "$scratch/original.mjs" "$scratch/diagnostic.mjs"
          node --check "$scratch/diagnostic.mjs"
          python worker/stage_worker_mini_app.py "$scratch/diagnostic.mjs"
          python worker/mini_app_d1_aggregate_probe_with_rollback_v052.py
