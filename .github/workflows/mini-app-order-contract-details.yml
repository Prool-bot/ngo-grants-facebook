name: NGO Grants Mini App — D1 queue schema and no-DM mock audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-app-order-contract-details.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngo-grants-worker-production-deploy
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check read-only probe syntax
        run: |
          python -m py_compile worker/read_live_mini_app_v04_contract.py
          node --check tests/probe_mini_app_live_order_schema_and_no_dm.mjs
      - name: Simulate existing createRequest with only fake Telegram and fake D1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "${RUNNER_TEMP}/miniapp-schema-probe.XXXXXX")"
          trap 'rm -rf "$private_dir"' EXIT
          python worker/read_live_mini_app_v04_contract.py "$private_dir/approved-worker.mjs"
          node --check "$private_dir/approved-worker.mjs"
          node tests/probe_mini_app_live_order_schema_and_no_dm.mjs "$private_dir/approved-worker.mjs"
          echo 'NO_LIVE_ORDERS_NO_LIVE_TELEGRAM_MESSAGES_NO_D1_MODIFICATIONS'
