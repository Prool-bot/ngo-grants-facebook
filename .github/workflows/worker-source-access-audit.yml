name: NGO Grants - Worker source access audit (read only)

on:
  push:
    branches:
      - feature/worker-menu-source-access-v57
    paths:
      - .github/workflows/worker-source-access-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      NGO_BOT_GATEWAY_URL: ${{ secrets.NGO_BOT_GATEWAY_URL }}
    steps:
      - name: Verify Cloudflare Workers Script read scope without exporting source
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          from urllib.parse import urlsplit
          aid=os.environ.get("CF_ACCOUNT_ID","").strip()
          worker_token=os.environ.get("CF_WORKER_API_TOKEN","").strip()
          tok=(worker_token or os.environ.get("CF_API_TOKEN","").strip())
          print("WORKER_SCOPED_TOKEN_CONFIGURED", bool(worker_token))
          gate=os.environ.get("NGO_BOT_GATEWAY_URL","").strip().rstrip("/")
          if not aid or not tok:
              print("CLOUDFLARE_ACCOUNT_AND_TOKEN_MISSING")
              raise SystemExit(0)
          url="https://api.cloudflare.com/client/v4/accounts/"+aid+"/workers/scripts"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+tok,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                  data=json.load(resp)
              if not data.get("success"):
                  print("WORKERS_SCRIPTS_LIST_FAILED")
              else:
                  scripts=data.get("result") or []
                  print("WORKERS_SCRIPTS_READ_OK",len(scripts))
                  for item in scripts:
                      print("SCRIPT_NAME",item.get("id") or item.get("name") or "UNKNOWN")
          except urllib.error.HTTPError as e:
              print("WORKERS_SCRIPTS_READ_HTTP",e.code)
              if e.code==403:
                  print("WORKERS_SCRIPTS_READ_SCOPE_REQUIRED")
          except Exception as e:
              print("WORKERS_SCRIPTS_READ_ERROR",type(e).__name__)
          # The Workers AI token can belong to an account other than the
          # one hosting this webhook. Compare the Workers subdomain without
          # logging it or the endpoint hostname.
          try:
              subreq=urllib.request.Request(
                "https://api.cloudflare.com/client/v4/accounts/"+aid+"/workers/subdomain",
                headers={"Authorization":"Bearer "+tok,"Accept":"application/json"})
              with urllib.request.urlopen(subreq,timeout=20) as resp:
                  subjson=json.load(resp)
              subdomain=str((subjson.get("result") or {}).get("subdomain") or "")
              print("WORKERS_ACCOUNT_SUBDOMAIN_PRESENT",bool(subdomain))
          except urllib.error.HTTPError as e:
              subdomain=""
              print("WORKERS_ACCOUNT_SUBDOMAIN_HTTP",e.code)
          except Exception as e:
              subdomain=""
              print("WORKERS_ACCOUNT_SUBDOMAIN_ERROR",type(e).__name__)
          if gate:
              parsed=urlsplit(gate)
              if parsed.scheme!="https" or not parsed.netloc or parsed.path:
                  print("GATEWAY_URL_MALFORMED")
                  raise SystemExit(0)
              if subdomain:
                  print("GATEWAY_IN_TOKEN_ACCOUNT",
                        parsed.hostname.endswith("."+subdomain+".workers.dev"))
              try:
                  health_req=urllib.request.Request(
                      gate+"/health",
                      headers={"User-Agent":"Mozilla/5.0 NGOGrantsHealth/1.0",
                               "Accept":"application/json"})
                  with urllib.request.urlopen(health_req,timeout=15) as resp:
                      health=json.loads(resp.read(5000))
                  print("GATEWAY_HEALTH_OK",health.get("ok") is True,
                        health.get("name","UNKNOWN"))
              except urllib.error.HTTPError as e:
                  print("GATEWAY_HEALTH_HTTP",e.code)
              except Exception as e:
                  print("GATEWAY_HEALTH_ERROR",type(e).__name__)
          PY
